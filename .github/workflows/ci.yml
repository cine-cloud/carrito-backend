name: Java CI/CD Pipeline with Coverage Check

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and Run Tests with Coverage Check
        run: ./mvnw clean verify

      - name: Publish Coverage Summary in GitHub Actions
        if: always()
        run: |
          if [ -f "target/site/jacoco/jacoco.xml" ]; then
            python3 -c "
          import xml.etree.ElementTree as ET
          import os

          tree = ET.parse('target/site/jacoco/jacoco.xml')
          root = tree.getroot()
          counters = {c.get('type'): c for c in root.findall('counter')}
          
          if 'LINE' in counters:
              line_c = counters['LINE']
              missed = int(line_c.get('missed'))
              covered = int(line_c.get('covered'))
              total = missed + covered
              pct = (covered / total * 100) if total > 0 else 0
              status = '🟢 PASSED (Aprobado)' if pct >= 90 else '🔴 FAILED (Rechazado)'
              
              summary = f'''## 📊 Reporte de Cobertura de Código (JaCoCo)

          | Métrica | Cobertura Actual | Criterio de Aceptación | Estado |
          | --- | --- | --- | --- |
          | **Líneas de Código** | **{pct:.2f}%** ({covered}/{total} líneas) | **>= 90.00%** | **{status}** |
          '''
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(summary)
          "
          fi

      - name: Jacoco PR Commenter
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          min-coverage-changed-files: 90
          title: '📊 Jacoco Code Coverage Report'

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 5
