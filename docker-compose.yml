services:
  peliculas-app:
    build: ../peliculas-backend
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://peliculas-db:5432/peliculas_db
      SPRING_DATASOURCE_USERNAME: user_peliculas
      SPRING_DATASOURCE_PASSWORD: pass_peliculas    
    depends_on:
      - peliculas-db
      

  peliculas-db:
    image: postgres:16
    environment:
      POSTGRES_DB: peliculas_db
      POSTGRES_USER: user_peliculas
      POSTGRES_PASSWORD: pass_peliculas
    volumes:
      - peliculas-data:/var/lib/postgresql/data

  carritos-app:
    build: .
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://carritos-db:5432/carritos_db
      SPRING_DATASOURCE_USERNAME: user_carritos
      SPRING_DATASOURCE_PASSWORD: pass_carritos    
      PELICULAS_BASE_URL: http://peliculas-app:8080
    depends_on:
      - carritos-db
      - peliculas-app

  carritos-db:
    image: postgres:16
    environment:
      POSTGRES_DB: carritos_db
      POSTGRES_USER: user_carritos
      POSTGRES_PASSWORD: pass_carritos
    volumes:
      - carritos-data:/var/lib/postgresql/data

 

volumes:
  peliculas-data:
  carritos-data:
