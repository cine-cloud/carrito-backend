version: '3.8'

services:
  gateway:
    image: hmunoz79/apigateway:1.5
    container_name: carrito-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9500:9500"
    environment:
      SPRING_SERVER_PORT: 9500

      # ==== RUTA API PRINCIPAL ====
      SPRING_CLOUD_GATEWAY_ROUTES[0]_ID: carrito-service
      SPRING_CLOUD_GATEWAY_ROUTES[0]_URI: http://carritos-app:8081
      SPRING_CLOUD_GATEWAY_ROUTES[0]_PREDICATES[0]: Path=/carritos/**
      SPRING_CLOUD_GATEWAY_ROUTES[0]_FILTERS[0]: StripPrefix=1

      # ==== RUTAS PARA SWAGGER ====
      SPRING_CLOUD_GATEWAY_ROUTES[1]_ID: carrito-swagger
      SPRING_CLOUD_GATEWAY_ROUTES[1]_URI: http://carritos-app:8081
      SPRING_CLOUD_GATEWAY_ROUTES[1]_PREDICATES[0]: Path=/carritos/swagger-ui/**,/carritos/v3/api-docs/**
      SPRING_CLOUD_GATEWAY_ROUTES[1]_FILTERS[0]: StripPrefix=1

    depends_on:
      - carritos-app

  carritos-app:
    build: .
    container_name: carritos-app-container
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SERVER_SERVLET_CONTEXT_PATH: /carritos
      SERVER_FORWARD_HEADERS_STRATEGY: native
      
      # Servicio de Películas (REST)
      PELICULAS_BASE_URL: http://host.docker.internal:8080

      # Configuración de base de datos
      SPRING_DATASOURCE_URL: jdbc:postgresql://carritos-db:5432/carritos_db
      SPRING_DATASOURCE_USERNAME: user_carritos
      SPRING_DATASOURCE_PASSWORD: pass_carritos

      # Configuración de Swagger (opcional, los defaults ya sirven)
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui/index.html

    depends_on:
      - carritos-db

  carritos-db:
    image: postgres:13-alpine
    container_name: carritos-db-container
    environment:
      POSTGRES_DB: carritos_db
      POSTGRES_USER: user_carritos
      POSTGRES_PASSWORD: pass_carritos
    volumes:
      - carritos-data:/var/lib/postgresql/data

volumes:
  carritos-data: