# ===============================
# Configuracion de aplicacion
# ===============================
server.port=8080
spring.application.name=carrito-service

# ===============================
# Configuracion de Base de Datos
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/carrito_db
spring.datasource.username=user_carritos
spring.datasource.password=pass_carritos
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# RabbitMQ
# ===============================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.acknowledge-mode=AUTO

rabbitmq.event.exchange.name=${APP_RABBITMQ_EXCHANGE:pelicula_exchange}
rabbitmq.event.consumer.queue.name=${APP_RABBITMQ_QUEUE:carrito.pelicula.queue}
rabbitmq.event.movie.routing.key=${APP_RABBITMQ_ROUTING_KEY:pelicula.event}

spring.main.allow-bean-definition-overriding=true
spring.retry.enabled=true

peliculas.base-url=${PELICULAS_BASE_URL:http://localhost:8080}
server.error.include-message=always